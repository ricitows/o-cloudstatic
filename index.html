inmax(0,1.6fr) minmax(230px,.7fr);border:1px solid var(--line);border-radius:7px;background:var(--paper);box-shadow:var(--shadow)}.profile-cover{grid-column:1/-1;height:120px;position:relative;padding:24px;background:var(--espresso);color:var(--petal);font:italic 15px Georgia,serif}.profile-avatar-large{position:absolute;left:26px;bottom:-35px;width:82px;height:82px;border:4px solid white;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--petal);color:var(--espresso);font:34px Georgia,serif}.profile-avatar-large img{width:100%;height:100%;object-fit:cover}.profile-form{padding:53px 24px 24px;display:grid;gap:16px}.field{display:grid;gap:7px;font-size:11px;font-weight:600}.field input{height:43px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:#fffdfa;color:var(--espresso)}.field input:disabled{background:#f1ece4;color:#84756d}.username-wrap{display:flex;align-items:center;height:43px;border:1px solid var(--line);border-radius:4px;background:#fffdfa;padding:0 11px}.username-wrap input{height:40px;border:0;outline:none;flex:1}.form-actions{display:flex;justify-content:flex-end;margin-top:4px}.profile-aside{padding:27px 23px;border-left:1px solid var(--line)}.profile-aside h3{margin:5px 0 24px;font-size:9px;letter-spacing:.18em;color:#98787a}.pref{display:grid;grid-template-columns:20px 1fr;gap:10px;margin:18px 0}.pref span{color:#ad7b85}.pref b{font-size:11px}.pref small{grid-column:2;color:var(--muted);font-size:10px;line-height:1.5}.outfit-form{display:grid;grid-template-columns:1fr auto;gap:10px;margin:18px 0}.outfit-form input{height:43px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:white}.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.pick{position:relative;border:1px solid var(--line);border-radius:5px;background:var(--paper);overflow:hidden}.pick img{width:100%;height:125px;object-fit:contain;background:#f6e9e7}.pick label{display:flex;align-items:center;gap:7px;padding:9px;font-size:10px}.outfit-list{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:22px}.outfit-item{padding:17px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}.outfit-item h3{margin:0 0 5px;font:500 22px Georgia,serif}.outfit-item p{margin:0;color:var(--muted);font-size:10px}.style-box{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:24px}.style-box h2{font:500 28px Georgia,serif;margin:8px 0}.style-box p{color:var(--muted);font-size:11px;line-height:1.7}.style-list{display:flex;gap:9px;flex-wrap:wrap}.style-chip{padding:8px 10px;border:1px solid var(--line);border-radius:30px;background:#fff;font-size:10px}.footer{padding:14px 46px 22px;color:#998a83;font-size:9px}.toast{position:fixed;z-index:20;right:22px;bottom:22px;max-width:min(420px,calc(100vw - 32px));padding:13px 17px;border-radius:5px;background:var(--espresso);color:white;box-shadow:0 9px 30px #0002;font-size:12px}.modal-backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#2618159c}.modal{width:min(620px,100%);max-height:min(90vh,850px);overflow:auto;padding:25px;border-radius:7px;background:var(--paper);box-shadow:0 30px 90px #0003}.modal-head{display:flex;justify-content:space-between;align-items:flex-start}.modal-head h2{margin:5px 0 18px;font:500 28px Georgia,serif}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:white;font-size:18px}.upload-preview{height:220px;margin:10px 0 17px;border:1px dashed #d8b8bd;border-radius:5px;background:#fae9ed;display:grid;place-items:center;overflow:hidden}.upload-preview img{max-width:100%;max-height:100%;object-fit:contain}.modal-fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.modal-note{margin:16px 0 0;color:var(--muted);font-size:10px;line-height:1.6}.mobile-top,.mobile-nav{display:none}.privacy-copy{max-width:800px;padding:26px;border:1px solid var(--line);background:var(--paper);line-height:1.8;color:#665650}.privacy-copy h2{font:500 25px Georgia,serif}
    @media(max-width:1100px){.garment-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.content{padding:35px 30px}.topbar{padding:0 30px}}
    @media(max-width:760px){.sidebar{display:none}.main{margin-left:0;padding-bottom:70px}.mobile-top{height:56px;display:flex;align-items:center;padding:0 19px;border-bottom:1px solid var(--line);background:#f9f5ee}.mobile-top .brand{margin:0;font-size:16px}.topbar{height:48px;padding:0 19px}.content{padding:26px 18px}.title-row{align-items:flex-start}.title-row h1{font-size:39px}.title-row .btn{padding:0 12px;white-space:nowrap}.stats{gap:7px}.stat{min-height:68px;padding:10px;gap:8px}.stat-icon{width:29px;height:29px;font-size:14px}.stat small{font-size:7px}.stat strong{font-size:18px}.home-grid{grid-template-columns:1fr}.next-panel{min-height:190px}.recent-grid{grid-template-columns:1fr 1fr}.recent-card:last-child{display:none}.recent-art{height:110px}.garment-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.garment-photo{height:160px}.profile-card{grid-template-columns:1fr}.profile-cover{height:106px}.profile-form{padding:51px 17px 20px}.profile-aside{border-left:0;border-top:1px solid var(--line);padding:18px}.pick-grid{grid-template-columns:repeat(2,1fr)}.outfit-list{grid-template-columns:1fr}.style-box{grid-template-columns:1fr;padding:18px}.footer{padding:10px 18px 20px}.mobile-nav{position:fixed;z-index:10;inset:auto 0 0;display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:var(--paper)}.mobile-nav button{display:grid;place-items:center;align-content:center;gap:3px;border:0;background:transparent;color:#887973;font-size:9px}.mobile-nav button span{font-size:17px}.mobile-nav button.active{color:var(--espresso);font-weight:700}.mobile-nav .mobile-add{color:#9c606e;font-size:24px}.modal-fields{grid-template-columns:1fr 1fr}.modal{padding:19px}.toast{bottom:77px}}

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">O-CLOÜD</div>
      <nav class="nav" aria-label="Navegación principal">
        <button class="nav-button active" data-page="Inicio"><span class="nav-icon">⌂</span>Inicio</button>
        <button class="nav-button" data-page="Closet"><span class="nav-icon">▤</span>Closet <span class="nav-count" id="side-count">0</span></button>
        <button class="nav-button" data-page="Outfits"><span class="nav-icon">◈</span>Outfits</button>
        <button class="nav-button" data-page="Perfil"><span class="nav-icon">○</span>Perfil</button>
      </nav>
      <button class="add-side" data-action="add"><span>＋</span><b>Añadir prenda</b><i>↗</i></button>
      <div class="sidebar-foot">
        <div class="side-divider"></div>
        <button class="stylist-link" data-page="Estilista"><span>☼</span><b>Estilista</b></button>
        <button class="user-link" data-page="Perfil"><span class="avatar" id="side-avatar">O</span><span class="user-copy"><b id="side-name">Perfil</b><small>Este navegador</small></span><span class="user-arrow">↗</span></button>
      </div>
    </aside>
    <div class="mobile-top"><div class="brand">O-CLOÜD</div></div>
    <main class="main">
      <header class="topbar"><div class="crumb"><b id="crumb">Inicio</b><span>·</span> Armario digital</div><div class="top-right"><span class="today" id="today"></span><span class="avatar top-avatar" id="top-avatar">O</span></div></header>
      <div class="content" id="content"></div>
      <footer class="footer">O-CLOÜD © 2026 <span>·</span> <button data-page="Privacidad" style="border:0;background:none;color:inherit;padding:0">Privacidad</button></footer>
    </main>
    <nav class="mobile-nav" aria-label="Navegación móvil"><button class="active" data-page="Inicio"><span>⌂</span>Inicio</button><button data-page="Closet"><span>▤</span>Closet</button><button class="mobile-add" data-action="add" aria-label="Añadir prenda">＋</button><button data-page="Outfits"><span>◈</span>Outfits</button><button data-page="Perfil"><span>○</span>Perfil</button></nav>
  </div>
  <div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
  <script>
    (()=>{
      const STORE='ocloud-static-v1';
      const DB_NAME='ocloud-static-images-v1';
      const defaultState={page:'Inicio',profile:{name:'',username:'',avatar:null},garments:[],outfits:[]};
      let state; try{state={...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')};state.profile={...defaultState.profile,...(state.profile||{})};state.garments=state.garments||[];state.outfits=state.outfits||[]}catch{state={...defaultState,profile:{...defaultState.profile},garments:[],outfits:[]}}
      let imageDbPromise;const objectUrls=new Map();
      function save(){localStorage.setItem(STORE,JSON.stringify({page:state.page,profile:state.profile,garments:state.garments,outfits:state.outfits}))}
      function db(){if(!imageDbPromise)imageDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return imageDbPromise}
      async function putImage(key,blob){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('images','readwrite');tx.objectStore('images').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
      async function getImage(key){if(!key)return null;if(objectUrls.has(key))return objectUrls.get(key);const d=await db();const blob=await new Promise((resolve,reject)=>{const req=d.transaction('images').objectStore('images').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});if(!blob)return null;const url=URL.createObjectURL(blob);objectUrls.set(key,url);return url}
      async function removeImage(key){const url=objectUrls.get(key);if(url){URL.revokeObjectURL(url);objectUrls.delete(key)}const d=await db();return new Promise(resolve=>{const tx=d.transaction('images','readwrite');tx.objectStore('images').delete(key);tx.oncomplete=resolve;tx.onerror=resolve})}
      const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      function toast(message){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;setTimeout(()=>root.replaceChildren(),3200)}
      function dateText(){return new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}
      function pageTitle(){document.getElementById('crumb').textContent=state.page;document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===state.page));}
      async function avatarMarkup(key,letter='O',className='avatar'){const url=await getImage(key);return `<span class="${className}">${url?`<img src="${url}" alt="Foto de perfil">`:esc(letter||'O')}</span>`}
      async function refreshAvatars(){const first=state.profile.name.trim().charAt(0).toUpperCase()||'O';const [side,top]=await Promise.all([avatarMarkup(state.profile.avatar,first),avatarMarkup(state.profile.avatar,first,'avatar top-avatar')]);document.getElementById('side-avatar').outerHTML=side;document.getElementById('top-avatar').outerHTML=top;document.getElementById('side-name').textContent=state.profile.username?'@'+state.profile.username:'Perfil';document.getElementById('side-count').textContent=String(state.garments.length)}
      async function homeHtml(){
        const n=state.profile.name.trim().split(/\s+/)[0]||'bienvenida';
        const items=state.garments.slice(0,3);
        const cards=[];
        for(const item of items){
          const image=await getImage(item.image);
          const picture=image?`<img src="${image}" alt="${esc(item.name)}" style="width:100%;height:100%;object-fit:contain;padding:10px">`:'O';
          cards.push(`<article class="recent-card"><div class="recent-art">${picture}</div><div class="recent-copy"><small>${esc(item.category)}</small><b>${esc(item.name)}</b><span>${esc(item.color||'')}</span></div></article>`);
        }
        const recent=cards.length?`<div class="recent-grid">${cards.join('')}</div>`:`<div class="empty"><div class="empty-mark">O</div><h2>Empieza por una prenda</h2><p>Añade piezas a tu armario digital y crea un espacio que refleje tu estilo.</p><button class="btn petal" data-action="add">Añadir primera prenda</button></div>`;
        return `<section class="title-row"><div><span class="eyebrow">TU ARMARIO, CON INTENCIÓN</span><h1>Buenos días, <em style="color:#a26f79;font-style:normal">${esc(n)}</em></h1><p>Un espacio para vestir lo que ya eres.</p></div><button class="btn" data-action="add">＋ Añadir prenda</button></section><div class="stats"><div class="stat"><span class="stat-icon">▤</span><div><small>PRENDAS</small><strong>${state.garments.length}</strong></div></div><div class="stat"><span class="stat-icon">◈</span><div><small>OUTFITS</small><strong>${state.outfits.length}</strong></div></div><div class="stat"><span class="stat-icon">♡</span><div><small>ESTILO</small><strong>Personal</strong></div></div></div><div class="home-grid"><section class="panel calendar-panel"><div class="panel-head"><div><span class="eyebrow">PLANIFICACIÓN</span><h2>Calendario</h2></div><span class="today">${esc(dateText())}</span></div><div class="calendar-month"><strong>${new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric'}).format(new Date())}</strong><div class="cal-controls"><button aria-label="Mes anterior" disabled>‹</button><button aria-label="Mes siguiente" disabled>›</button></div></div><div class="calendar" id="calendar"></div><div class="calendar-foot">Tu calendario está listo para organizar looks.</div></section><section class="panel next-panel"><span class="eyebrow">SIGUIENTE LOOK</span><h2>${state.outfits.length?esc(state.outfits[0].name):'Un día, un look'}</h2><p>${state.outfits.length?'Tu outfit guardado está listo para inspirarte.':'Crea combinaciones con las prendas de tu Closet.'}</p><button class="btn ghost" data-page="Outfits">${state.outfits.length?'Ver outfits':'Crear outfit'} ↗</button><div class="ornament">O·O</div></section></div><div class="section-head"><div><span class="eyebrow">TU SELECCIÓN</span><h2>Prendas recientes</h2></div><button data-page="Closet">Ver Closet ↗</button></div>${recent}`;
      }
      async function closetHtml(){const cards=await Promise.all(state.garments.map(async item=>{const image=await getImage(item.image);return `<article class="garment-card" data-category="${esc(item.category)}"><div class="garment-photo">${image?`<img src="${image}" alt="${esc(item.name)}">`:'<span class="garment-placeholder">◇</span>'}</div><div class="garment-copy"><small>${esc(item.category)}${item.subcategory?' · '+esc(item.subcategory):''}</small><b>${esc(item.name)}</b><div class="garment-meta"><span>${esc(item.color||'Sin color')}</span><button class="icon-action" data-remove="${esc(item.id)}" aria-label="Eliminar ${esc(item.name)}">×</button></div></div></article>`}));return `<section class="title-row"><div><span class="eyebrow">TU ARMARIO DIGITAL</span><h1>Closet</h1><p>${state.garments.length} prendas seleccionadas con intención.</p></div><button class="btn" data-action="add">＋ Añadir prenda</button></section><div class="closet-tools"><input class="search" id="search" type="search" placeholder="Buscar prendas…" aria-label="Buscar prendas"><select class="filter" id="category-filter" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option><option>Parte superior</option><option>Parte inferior</option><option>Vestidos</option><option>Calzado</option><option>Accesorios</option><option>Prendas exteriores</option></select></div>${cards.length?`<div class="garment-grid" id="garment-grid">${cards.join('')}</div>`:`<div class="empty"><div class="empty-mark">◇</div><h2>Tu Closet comienza aquí</h2><p>Guarda tus prendas para tenerlas siempre a la vista en este navegador.</p><button class="btn petal" data-action="add">Añadir primera prenda</button></div>`}`}
      async function outfitsHtml(){const choices=await Promise.all(state.garments.map(async item=>{const image=await getImage(item.image);return `<div class="pick"><img src="${image||''}" alt="${esc(item.name)}"><label><input type="checkbox" name="piece" value="${esc(item.id)}">${esc(item.name)}</label></div>`}));return `<section class="title-row"><div><span class="eyebrow">COMPOSICIÓN PERSONAL</span><h1>Outfits</h1><p>Combina las prendas que ya forman parte de tu armario.</p></div></section>${state.garments.length?`<form id="outfit-form" class="outfit-form"><input name="name" required maxlength="60" placeholder="Nombre del outfit, por ejemplo: Tarde de domingo"><button class="btn petal">Guardar outfit</button><div class="pick-grid" style="grid-column:1/-1">${choices.join('')}</div></form>`:`<div class="empty"><div class="empty-mark">◈</div><h2>Añade prendas primero</h2><p>Cuando tu Closet tenga algunas piezas, podrás crear combinaciones aquí.</p><button class="btn petal" data-action="add">Añadir prenda</button></div>`}${state.outfits.length?`<div class="section-head"><div><span class="eyebrow">GUARDADOS EN ESTE NAVEGADOR</span><h2>Tus combinaciones</h2></div></div><div class="outfit-list">${state.outfits.map(outfit=>`<article class="outfit-item"><h3>${esc(outfit.name)}</h3><p>${outfit.ids.length} prendas</p></article>`).join('')}</div>`:''}`}
      async function profileHtml(){const avatar=await getImage(state.profile.avatar);const initial=state.profile.name.trim().charAt(0).toUpperCase()||'O';return `<section class="title-row"><div><span class="eyebrow">TU ESPACIO PERSONAL</span><h1>Perfil</h1><p>La información y los cambios quedan guardados solo en este navegador.</p></div></section><div class="profile-card"><div class="profile-cover">O-CLOÜD<div class="profile-avatar-large">${avatar?`<img src="${avatar}" alt="Foto de perfil">`:esc(initial)}</div></div><form class="profile-form" id="profile-form"><label class="field">Foto de perfil<input type="file" name="avatar" accept="image/jpeg,image/png,image/webp"></label><label class="field">Nombre de usuario<div class="username-wrap"><span>@</span><input name="username" value="${esc(state.profile.username)}" placeholder="usuario" pattern="[A-Za-z0-9_]{3,24}" maxlength="24"></div></label><label class="field">Nombre para mostrar<input name="name" value="${esc(state.profile.name)}" placeholder="Tu nombre" maxlength="80" required></label><div class="form-actions"><button class="btn petal">Guardar cambios</button></div></form><aside class="profile-aside"><h3>PREFERENCIAS</h3><div class="pref"><span>✳</span><b>Tu estilo personal</b><small>Preferencias, colores y ocasiones favoritas</small></div><div class="pref"><span>⌖</span><b>Tu ubicación</b><small>Ideas de outfits sin conectar servicios externos</small></div><div class="pref"><span>♡</span><b>Privacidad</b><small>Los datos se conservan en este navegador</small></div></aside></div>`}
      function stylistHtml(){const categories=[...new Set(state.garments.map(item=>item.category))];let tip='Añade prendas a tu Closet para recibir ideas de combinación.';if(categories.includes('Parte superior')&&categories.includes('Parte inferior'))tip='Prueba combinar tu parte superior favorita con una pieza neutra de la parte inferior.';else if(state.garments.length)tip='Elige una pieza protagonista y mantén el resto del look sencillo.';return `<section class="title-row"><div><span class="eyebrow">RECOMENDACIONES LOCALES</span><h1>Estilista</h1><p>Ideas básicas creadas en tu navegador, sin servicios externos.</p></div></section><div class="panel style-box"><div><span class="eyebrow">UNA IDEA PARA HOY</span><h2>Viste con lo que ya tienes.</h2><p>${esc(tip)}</p><div class="style-list">${(categories.length?categories:['Tu estilo']).map(item=>`<span class="style-chip">${esc(item)}</span>`).join('')}</div></div><div><span class="eyebrow">PALETA O-CLOÜD</span><p>Ivory Hearth · Deep Espresso · Petal Reverie</p><div class="style-list"><span class="style-chip">Minimal</span><span class="style-chip">Editorial</span><span class="style-chip">Personal</span></div></div></div>`}
      function privacyHtml(){return `<section class="title-row"><div><span class="eyebrow">INFORMACIÓN</span><h1>Privacidad</h1></div></section><div class="privacy-copy"><h2>Una versión estática, local</h2><p>Esta copia de O-CLOÜD no se conecta a Supabase ni a servicios de IA. Las prendas, outfits, foto y perfil se guardan en el almacenamiento de este navegador (localStorage e IndexedDB). No aparecen en otros dispositivos y pueden perderse si borras los datos del navegador.</p><p>La versión estática no tiene registro, inicio de sesión, sincronización en la nube, eliminación de fondos ni generación 3D.</p><button class="btn ghost" data-action="clear-local">Borrar mis datos locales</button></div>`}
      async function render(){pageTitle();await refreshAvatars();const content=document.getElementById('content');content.innerHTML=state.page==='Inicio'?await homeHtml():state.page==='Closet'?await closetHtml():state.page==='Outfits'?await outfitsHtml():state.page==='Perfil'?await profileHtml():state.page==='Estilista'?stylistHtml():privacyHtml();if(state.page==='Inicio')drawCalendar();}
      function drawCalendar(){const el=document.getElementById('calendar');if(!el)return;const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),offset=(first.getDay()+6)%7,days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();el.innerHTML=['L','M','X','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:days},(_,index)=>`<button class="${index+1===now.getDate()?'today':''}">${index+1}</button>`).join('')}
      function openModal(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><span class="eyebrow">TU ARMARIO DIGITAL</span><h2 id="modal-title">Añadir prenda</h2></div><button class="close" data-action="close-modal" aria-label="Cerrar">×</button></div><form id="garment-form"><label class="field">Fotografía<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label><div class="upload-preview" id="upload-preview"><span class="garment-placeholder">◇</span></div><div class="modal-fields"><label class="field">Nombre<input name="name" required maxlength="80" placeholder="Ej. Suéter de punto"></label><label class="field">Categoría<select name="category" required><option value="">Elige una</option><option>Parte superior</option><option>Parte inferior</option><option>Vestidos</option><option>Calzado</option><option>Accesorios</option><option>Prendas exteriores</option></select></label><label class="field">Subcategoría<input name="subcategory" maxlength="60" placeholder="Opcional"></label><label class="field">Color<input name="color" maxlength="50" placeholder="Opcional"></label></div><p class="modal-note">La fotografía se conserva en este navegador. No se sube a Supabase ni se procesa con Clipdrop.</p><div class="form-actions" style="margin-top:18px"><button class="btn petal">Guardar prenda</button></div></form></section></div>`;}
      document.addEventListener('click',async event=>{const button=event.target.closest('[data-page],[data-action],[data-remove]');if(!button)return;if(button.dataset.page){state.page=button.dataset.page;save();await render();window.scrollTo({top:0,behavior:'smooth'});return}if(button.dataset.action==='add'){openModal();return}if(button.dataset.action==='close-modal'&&(button.classList.contains('close')||event.target.classList.contains('modal-backdrop'))){document.getElementById('modal-root').replaceChildren();return}if(button.dataset.action==='clear-local'){if(confirm('¿Borrar prendas, outfits y perfil guardados en este navegador?')){const keys=[...state.garments.map(x=>x.image),state.profile.avatar].filter(Boolean);for(const key of keys)await removeImage(key);state={...defaultState,profile:{...defaultState.profile},garments:[],outfits:[]};save();await render();toast('Datos locales borrados.')}return}if(button.dataset.remove){const item=state.garments.find(x=>x.id===button.dataset.remove);if(item&&confirm(`¿Eliminar “${item.name}” de este navegador?`)){state.garments=state.garments.filter(x=>x.id!==item.id);state.outfits=state.outfits.filter(x=>!x.ids.includes(item.id));await removeImage(item.image);save();await render();toast('Prenda eliminada.')}}});
      document.addEventListener('input',event=>{if(event.target.id==='search'||event.target.id==='category-filter'){const q=(document.getElementById('search')?.value||'').toLowerCase(),category=document.getElementById('category-filter')?.value||'';document.querySelectorAll('.garment-card').forEach(card=>{const text=card.textContent.toLowerCase();card.hidden=!!(q&&!text.includes(q)||category&&card.dataset.category!==category)})}});
      document.addEventListener('change',event=>{if(event.target.name==='image'){const file=event.target.files?.[0],preview=document.getElementById('upload-preview');if(!preview)return;if(!file){preview.innerHTML='<span class="garment-placeholder">◇</span>';return}if(file.size>10*1024*1024){event.target.value='';toast('La imagen debe pesar menos de 10 MB.');return}preview.innerHTML=`<img src="${URL.createObjectURL(file)}" alt="Vista previa de la prenda">`}});
      document.addEventListener('submit',async event=>{if(event.target.id==='garment-form'){event.preventDefault();const form=event.target,fd=new FormData(form),file=fd.get('image');if(!(file instanceof File)||!file.size)return;const id=crypto.randomUUID();try{await putImage(id,file);state.garments.unshift({id,image:id,name:String(fd.get('name')).trim(),category:String(fd.get('category')),subcategory:String(fd.get('subcategory')||'').trim(),color:String(fd.get('color')||'').trim()});save();document.getElementById('modal-root').replaceChildren();await render();toast('Prenda guardada en este navegador.')}catch{toast('No se pudo guardar la imagen en este navegador.')}return}if(event.target.id==='profile-form'){event.preventDefault();const form=event.target,fd=new FormData(form),name=String(fd.get('name')||'').trim(),username=String(fd.get('username')||'').trim().replace(/^@/,'').toLowerCase(),file=fd.get('avatar');if(!name||name.length>80){toast('Escribe un nombre de hasta 80 caracteres.');return}if(username&&!/^[a-z0-9_]{3,24}$/.test(username)){toast('El usuario debe tener de 3 a 24 letras, números o guiones bajos.');return}if(file instanceof File&&file.size){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('Elige una foto JPG, PNG o WEBP de hasta 5 MB.');return}try{await putImage('avatar',file);state.profile.avatar='avatar'}catch{toast('No se pudo guardar la foto en este navegador.');return}}state.profile.name=name;state.profile.username=username;save();await render();toast('Cambios guardados en este navegador.');return}if(event.target.id==='outfit-form'){event.preventDefault();const form=event.target,fd=new FormData(form),ids=fd.getAll('piece').map(String),name=String(fd.get('name')||'').trim();if(!ids.length){toast('Selecciona al menos una prenda.');return}state.outfits.unshift({id:crypto.randomUUID(),name,ids});save();await render();toast('Outfit guardado en este navegador.')}});
      document.getElementById('today').textContent=dateText();render();
    })();
  </script>
</body>
</html>
